name: HashLink

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    name: HashLink, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # HashLink's JIT runs on x86 alone, and has no arm64 macOS build.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          runtime: hl
      # Fails without OpenGL ES, rather than passing on the line the check prints
      # without it.
      - run: |
          hxn check hl 2>&1 | tee check.txt
          grep -q '^render: 4x4 pixels' check.txt
          grep -q '^textured: 4x4 pixels' check.txt
          grep -q '^buffer: 16 values' check.txt
