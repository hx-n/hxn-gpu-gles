name: release

# Builds the haxelib: the generated Haxe classes and the native libraries for
# each platform, so a program needs only Haxe, and tries it on each platform
# without Rust. A tag `v*` then publishes it as a release asset and submits it
# to haxelib. Manual runs build only unless release_tag selects an existing tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to publish; blank builds only
        required: false
        type: string

defaults:
  run:
    shell: bash

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.source.outputs.revision }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - id: source
        env:
          HXN_RELEASE_TAG: ${{ inputs.release_tag || (github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          python3 - <<'PYTHON'
          import json, os, re, subprocess, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('Cargo.toml').read_text())['package']['version']
          assert json.loads(Path('haxelib.json').read_text())['version'] == version
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          tag = os.environ['HXN_RELEASE_TAG']
          if tag:
              assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag), 'Expected an existing v<major>.<minor>.<patch> tag'
              assert tag == 'v' + version, 'Tag and package versions differ'
              tagged = subprocess.check_output(['git', 'rev-parse', '--verify', 'refs/tags/' + tag + '^{commit}'], text=True).strip()
              assert tagged == revision, 'Checkout differs from selected tag'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('revision=' + revision + '\n' + 'tag=' + tag + '\n')
          PYTHON

  package:
    needs: source
    name: package, ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    name: linux-x86_64 }
          - { os: ubuntu-24.04-arm, name: linux-aarch64 }
          - { os: macos-15,     name: macos-aarch64 }
          - { os: windows-latest,   name: windows-x86_64 }
          # Cross-compiled static libraries: hxcpp links one into the program,
          # and Ash links one into a HashLink program for a mobile device. No
          # iOS, which has no EGL.
          # Intel packages retain the supported hxcpp archive.
          - { os: macos-15-intel, name: macos-x86_64,  runtimes: cpp,    target: x86_64-apple-darwin }
          - { os: ubuntu-latest, name: android,       runtimes: hl cpp, target: aarch64-linux-android }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.revision }}
      - run: python3 scripts/third_party_notices.py --check
      - uses: ./.github/actions/setup
        with:
          runtime: package
      - if: matrix.target
        run: rustup target add ${{ matrix.target }}
      - run: hxn package ${{ matrix.runtimes || 'hl cpp' }} --release ${{ matrix.target && format('--target {0}', matrix.target) || '' }} --out package
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: package

  haxelib:
    needs: [source, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.revision }}
      - uses: actions/download-artifact@v4
        with:
          path: parts
      # The classes and the manifest are the same on every platform; each
      # platform adds its native/<triple>/.
      - run: |
          mkdir haxelib
          cp -R parts/package-linux-x86_64/. haxelib/
          for part in parts/*/; do
            cp -R "$part/native/." haxelib/native/
          done
          cp -R README.md LICENSE skills third-party haxelib/
          ls haxelib/native
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          (cd haxelib && zip -qr "../hxn-gpu-gles-$version.zip" .)
          echo "ZIP=hxn-gpu-gles-$version.zip" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: haxelib
          path: ${{ env.ZIP }}

  # What a Haxe developer does, with no Rust: install the ZIP and build the
  # check against it, then run it on Ash and hxcpp, with Mesa's OpenGL ES on
  # Linux and Electron's ANGLE on macOS.
  try:
    name: try, ${{ matrix.os }}
    needs: [source, haxelib]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.revision }}
          sparse-checkout: examples
      - uses: actions/download-artifact@v4
        with:
          name: haxelib
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgles2 libegl-mesa0 libgl1-mesa-dri
      # ANGLE's EGL and OpenGL ES, from Electron's release.
      - if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$RUNNER_TEMP/angle"
          gh release download v43.8.3 --repo electron/electron --pattern 'electron-v43.8.3-darwin-arm64.zip' --dir "$dir"
          libs='Electron.app/Contents/Frameworks/Electron Framework.framework/Versions/A/Libraries'
          unzip -q -j "$dir"/electron-*.zip "$libs/libEGL.dylib" "$libs/libGLESv2.dylib" -d "$dir"
          echo "HXN_GPU_GLES_EGL=$dir/libEGL.dylib" >> "$GITHUB_ENV"
      - if: runner.os == 'Windows' || (runner.os == 'Linux' && runner.arch != 'ARM64')
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.6
      - if: runner.os == 'macOS'
        run: |
          brew install haxe
          mkdir -p "$HOME/haxelib" && haxelib setup "$HOME/haxelib"
      # setup-haxe has no Linux ARM64 build; Ubuntu packages one.
      - if: runner.os == 'Linux' && runner.arch == 'ARM64'
        run: |
          sudo apt-get update
          sudo apt-get install -y haxe
          mkdir -p "$HOME/haxelib" && haxelib setup "$HOME/haxelib"
      # The hxn haxelib the package depends on comes from haxelib with it.
      - name: Install the haxelib and hxcpp
        run: |
          haxelib install hxn-gpu-gles-*.zip --always
          haxelib install hxnsl --always
          haxelib git hxcpp https://github.com/HaxeFoundation/hxcpp --quiet
          dir="$(haxelib libpath hxcpp)"
          git -C "$dir" checkout -q 615adc73d5ef28f3f74ea47977c39c4f25ce256d
          (cd "$dir/tools/hxcpp" && haxe compile.hxml)
      - name: Install Ash
        run: |
          case "$RUNNER_OS" in
            Linux) archive=ash-linux-$([ "$RUNNER_ARCH" = ARM64 ] && echo aarch64 || echo x86_64).tar.gz ;;
            macOS) archive=ash-macos-aarch64.tar.gz ;;
            Windows) archive=ash-windows-x86_64.tar.gz ;;
          esac
          mkdir -p "$RUNNER_TEMP/ash"
          # Extracted in place: tar reads a Windows path's drive as a host.
          (cd "$RUNNER_TEMP/ash" && curl -fsSL "https://github.com/rayzor-blade/ash/releases/download/v0.1.18/$archive" | tar -xz)
          echo "ASH=$RUNNER_TEMP/ash/ash" >> "$GITHUB_ENV"
      - name: Build and run on Ash and hxcpp
        working-directory: examples/check
        run: |
          haxe -lib hxn-gpu-gles -lib hxnsl -main Main -hl main.hl
          "$ASH" main.hl | tee hl.txt
          haxe -lib hxn-gpu-gles -lib hxnsl -main Main -cpp out
          out/Main | tee cpp.txt
          grep -q '^render: 4x4 pixels' hl.txt && grep -q '^render: 4x4 pixels' cpp.txt

  publish:
    needs: [source, haxelib, try]
    if: needs.source.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.revision }}
      - uses: actions/download-artifact@v4
        with:
          name: haxelib
      - run: echo "ZIP=$(ls hxn-gpu-gles-*.zip)" >> "$GITHUB_ENV"
      - env:
          GH_TOKEN: ${{ github.token }}
          HXN_RELEASE_TAG: ${{ needs.source.outputs.tag }}
          HXN_RELEASE_REVISION: ${{ needs.source.outputs.revision }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$HXN_RELEASE_TAG" --jq .sha)" = "$HXN_RELEASE_REVISION"
          gh release create "$HXN_RELEASE_TAG" "$ZIP" --title "$HXN_RELEASE_TAG" --notes "$(sed -n 's/^releasenote = "\(.*\)"/\1/p' Cargo.toml)"
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.6
      # haxelib accepts a new project only from its first contributor.
      - env:
          HAXELIB_PASSWORD: ${{ secrets.HAXELIB_PASSWORD }}
        run: haxelib submit "$ZIP" darmie "$HAXELIB_PASSWORD" --never < /dev/null
