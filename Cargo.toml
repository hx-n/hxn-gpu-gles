[package]
name = "hxn-gpu-gles"
version = "0.3.1"
edition = "2024"
description = "OpenGL ES 3 for Haxe over EGL: contexts, buffers, textures, samplers, programs, vertex arrays and framebuffers"
repository = "https://github.com/hx-n/hxn-gpu-gles"
license = "Apache-2.0"
keywords = ["opengl-es", "gles", "egl", "gpu", "haxe", "graphics", "glsl", "linux", "android", "native", "hxcpp", "hashlink", "cross"]

[lib]
name = "hxn_gpu_gles"

[package.metadata.hxn]
# The native library is `gpu_gles.hdll` or `libgpu_gles.a`.
library = "gpu_gles"
haxelib = "hxn-gpu-gles"
contributors = ["darmie", "rayzor"]
releasenote = "Use hxn 0.3.9 shared logging with application-owned filtering and sinks; retain pinned dependency redistribution notices."
# The check `hxn check` and `hxn run` build.
haxe = "examples/check"
haxe-flags = ["-lib", "hxnsl"]
# Registers hxnsl's GLSL target for hxn.gpu.gles.Shader, from sources/.
init = ["hxn.gpu.gles.Shaders.register()"]

[dependencies]
hxn = { git = "https://github.com/hx-n/hxn.git", tag = "v0.3.9" }
hxn-future = { git = "https://github.com/hx-n/hxn.git", tag = "v0.3.9" }
glow = "0.18"
# Loads EGL at run time, so the library links against no GL.
khronos-egl = { version = "6", features = ["dynamic"] }
libloading = "0.8"

# ANGLE on macOS presents to a CALayer, which raw-window-metal puts on a window's NSView.
[target.'cfg(target_os = "macos")'.dependencies]
raw-window-metal = "0.4"
